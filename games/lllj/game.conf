# Launcher settings for ライムライト・レモネードジャム, sourced by ../../run.sh.

# Run directory (relative to the repository): symlinks into the unpacked game
# data plus repacked patch archives, made by games/lllj/setup.sh. The engine
# executable is copied here because the game finds patch.xp3 and plugin/ via
# System.exePath.
RUN_DIR=game

# The game's CanLoadPlugin() requires these DLL files to exist before it calls
# Plugins.link; the compatibility modules provide what they stand for. When the
# game starts linking another DLL, add its name here.
PLACEHOLDER_DIRS=(plugin plugin64)   # the SDL engine searches plugin/, the game checks plugin64/
PLACEHOLDER_DLLS=(PackinOne KAGParserEx wuvorbis wuopus win32dialog AlphaMovie fstat
	motionplayer_nod3d layerStwCopy)

# -used2d=no / -debugwin=no keep the game from linking D2D and from emulating
# the krkr2 debug console (both end in Win32 dialogs).
ENGINE_ARGS=(-loglevel=INFO -used2d=no -debugwin=no)

# Called with the user's arguments; may append to ENGINE_ARGS.
game_prepare() {
	local zh=false arg has_datapath=false
	[[ -e "$RUN/lllj_zh.pck" ]] && zh=true
	for arg in "$@"; do
		[[ "$arg" == -datapath=* ]] && has_datapath=true
		[[ "$arg" == -lllj_zh=no ]] && zh=false
	done
	"$has_datapath" && return
	local base="${XDG_DATA_HOME:-$HOME/.local/share}/limelight_lj"
	# The Chinese build keeps its own saves (lllj_zh.dll's SaveDataPath, savedata_zh).
	if "$zh"; then ENGINE_ARGS+=("-datapath=$base/savedata_zh/"); else ENGINE_ARGS+=("-datapath=$base/"); fi
}
