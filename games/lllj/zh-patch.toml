# Chinese patch (lllj_zh.exe / lllj_zh.dll), read by modules/xpck-patch.
#
# lllj_zh.dll is a Detours hook DLL whose behaviour is driven by a JSON config
# embedded in its resources (RVA 0x29b0f0). This is that config, translated to
# TOML, limited to what applies on Linux:
#   PatchPacks          -> pack
#   Multilang.RedirectTable (Map[jp, cn, tw], "Eval" 0/1) -> [[redirect]]
#   Subtitles / SubtitleFonts -> [[subtitles]] / [[subtitle_fonts]]
# SaveDataPath ("savedata_zh") is applied by the launcher (game.conf). The other
# hooks (code page 932, TaskDialog, window icon, DRM checks) are Windows only.

option = "lllj_zh"     # -lllj_zh=no: Japanese game; -lllj_zh=<path>: pack location
pack = "lllj_zh.pck"   # default: next to the executable

# Language expressions, evaluated on the main thread: 0 jp, 1 cn (simplified), 2 tw.
[languages]
# DLL "Eval":0
text = '(typeof kag == "Object") ? kag.languageType : 0'
# DLL "Eval":1 (plain SystemConfig.uiLanguageType). Lookups here also come from
# existence checks, some while kag is being built; the patch's getter returns 0
# (no redirect) without kag, so it is skipped until then.
ui = '(typeof kag == "Object" && typeof SystemConfig == "Object") ? SystemConfig.uiLanguageType : void'

# from = bare file name; to = [jp, cn, tw] ("" = unchanged)
